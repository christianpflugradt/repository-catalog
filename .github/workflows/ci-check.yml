name: CI check

on:
  workflow_call:
    inputs:
      runner:
        description: The runner image the checks run on
        type: string
        default: ubuntu-26.04
      env:
        description: Further environment variables for the setup and the checks, one NAME=value per line
        type: string
        default: ''
    secrets:
      GEMINI_API_KEY:
        description: Key of the model API that the reviews use; without it the reviews cannot run
        required: false
      GATEWAY_URL:
        description: Origin of the gateway that receives the attestation; without it, and on every ref but main, nothing is published
        required: false
      GATEWAY_KEY:
        description: Needed only for publishing with API-key authentication (publish.auth other than github-oidc). Passed as PLEASE_GATEWAY_KEY.
        required: false

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false' # Install tools explicitly before running tasks.

jobs:
  check:
    name: Check
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export environment variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            if ! [[ "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::Invalid environment line, expected NAME=value" >&2
              exit 1
            fi
            case "${BASH_REMATCH[1]}" in
              PATH | BASH_ENV | NODE_OPTIONS | GITHUB_* | RUNNER_* | LD_* | DYLD_*)
                echo "::error::The variable ${BASH_REMATCH[1]} must not be set" >&2
                exit 1
                ;;
            esac
            echo "$line" >>"$GITHUB_ENV"
          done <<<"$VARIABLES"
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          experimental: true
          version: 2026.11.12
      - name: Fetch locked dependencies
        run: mise run setup
      - name: Trust the shared governance repository
        run: please trust https://github.com/christianpflugradt/repository-catalog.git
      - name: Run Please Behave checks
        uses: please-behave/action@0d9c81df1e374603a643223fb1c82c97c9688dc4 # v1.10.0
        with:
          install: 'false'
          sync: 'true'
          execution-point: check
          summary: 'true'
          gateway-url: ${{ github.ref == 'refs/heads/main' && secrets.GATEWAY_URL || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLEASE_GATEWAY_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GATEWAY_KEY || '' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-check-${{ inputs.runner }}
          path: .please/reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
