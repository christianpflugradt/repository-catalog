name: Rule registration

on:
  workflow_call:
    inputs:
      runner:
        description: Runner used by the repository checks
        type: string
        default: ubuntu-26.04
      env:
        description: Environment for setup and checks, one NAME=value per line
        type: string
        default: ''
    secrets:
      GATEWAY_URL:
        required: true
      GATEWAY_KEY:
        description: Needed only for API-key authentication (publish.auth other than github-oidc). Passed as PLEASE_GATEWAY_KEY.
        required: false

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  register:
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ github.event.repository.private && 5 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export environment variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            if ! [[ "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::Invalid environment line, expected NAME=value" >&2
              exit 1
            fi
            case "${BASH_REMATCH[1]}" in
              PATH | BASH_ENV | NODE_OPTIONS | GITHUB_* | RUNNER_* | LD_* | DYLD_*)
                echo "::error::The variable ${BASH_REMATCH[1]} must not be set" >&2
                exit 1
                ;;
            esac
            echo "$line" >>"$GITHUB_ENV"
          done <<<"$VARIABLES"
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          experimental: true
          version: 2026.11.12
      - name: Fetch locked dependencies
        run: mise run setup
      - name: Trust the shared governance repository
        run: please trust https://github.com/christianpflugradt/repository-catalog.git
      - name: Run Please Behave checks
        uses: please-behave/action@0d9c81df1e374603a643223fb1c82c97c9688dc4 # v1.10.0
        with:
          install: 'false'
          sync: 'true'
          execution-point: check
          checks-only: 'true'
          summary: 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Register committed rule versions
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          PLEASE_GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
        run: |
          set -eu
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error::Set GATEWAY_URL for rule registration."
            exit 1
          fi
          please register --gateway-url "$GATEWAY_URL"
