name: Release readiness

on:
  workflow_call:
    inputs:
      source-sha:
        description: The commit planned for the release
        type: string
        required: true
      required-jobs:
        description: Newline-separated names of the CI jobs that must have succeeded, including every matrix entry
        type: string
        default: Check

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  readiness:
    name: Readiness
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          experimental: true
          install_args: python
          version: 2026.11.12
      - name: Verify exact-source CI prerequisites
        uses: christianpflugradt/repository-catalog/actions/release/check-ci@74c1911d36c4f967b43040c5179e4ca5f6b0080b # updates/actions/release
        with:
          required-jobs: ${{ inputs.required-jobs }}
